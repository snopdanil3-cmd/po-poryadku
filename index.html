<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Po poryadku: подготовка к ЕГЭ</title>
<meta name="description" content="Бесплатная подготовка к ЕГЭ по профильной математике: темы в правильном порядке, задачи с проверкой ответов, повторение ошибок. Без регистрации.">
<link rel="icon" type="image/png" href="img/mark-l.png">
<script>try{var t=JSON.parse(localStorage.getItem('marshrut.v1')||'{}').theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Noto+Sans+Math&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.8"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/></symbol>
    <symbol id="i-progress" viewBox="0 0 24 24"><path d="M3 20.5h18"/><rect x="5" y="11" width="3.4" height="7" rx="1"/><rect x="10.3" y="5" width="3.4" height="13" rx="1"/><rect x="15.6" y="13" width="3.4" height="5" rx="1"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><path d="M13 3 5.5 13.5H11L10 21l8-10.5h-5.5z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></symbol>
    <symbol id="i-mark" viewBox="0 0 32 32"><path d="M6 25c7 0 4-9 10-9s3-9 10-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="25" r="3.2" fill="currentColor"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/><circle cx="26" cy="7" r="3.2" fill="currentColor"/></symbol>
  </defs>
</svg>
<div class="app">
  <aside class="side" aria-label="Разделы">
    <div class="brand"><img class="mark-img lg-l" src="img/mark-l.png" alt=""><img class="mark-img lg-d" src="img/mark-d.png" alt=""><span>Po poryadku</span></div>
    <nav>
      <button data-go="today"><svg class="ic" aria-hidden="true"><use href="#i-today"/></svg>Сегодня</button>
      <button data-go="route"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg>Маршрут</button>
      <button data-go="tasks"><svg class="ic" aria-hidden="true"><use href="#i-tasks"/></svg>Задания</button>
      <button data-go="progress"><svg class="ic" aria-hidden="true"><use href="#i-progress"/></svg>Прогресс</button>
      <button data-go="train"><svg class="ic" aria-hidden="true"><use href="#i-train"/></svg>Тренажёры</button>
    </nav>
    <div class="side-foot"><span>Сейчас</span><b id="side-week">&nbsp;</b><span>Бесплатно, без регистрации</span><a href="#about">О проекте</a></div>
  </aside>

  <div class="main">
    <header class="top">
      <h1><img class="mark-img lg-l" src="img/mark-l.png" alt=""><img class="mark-img lg-d" src="img/mark-d.png" alt=""><span id="screen-title">Сегодня</span></h1>
      <div class="mode">
        <span class="mode-l">Режим подготовки</span>
        <div class="seg" role="group" aria-label="Режим подготовки">
          <button type="button" data-mode="base" aria-pressed="true" title="2 урока в неделю, часть 1 целиком">Базовый</button>
          <button type="button" data-mode="plus" aria-pressed="false" title="3 урока в неделю и разбор части 2">70+</button>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"><p class="loading">Загрузка…</p></main>
  </div>
</div>

<nav class="tabbar" aria-label="Разделы">
  <button data-go="today"><svg class="ic" aria-hidden="true"><use href="#i-today"/></svg>Сегодня</button>
  <button data-go="route"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg>Маршрут</button>
  <button data-go="tasks"><svg class="ic" aria-hidden="true"><use href="#i-tasks"/></svg>Задания</button>
  <button data-go="progress"><svg class="ic" aria-hidden="true"><use href="#i-progress"/></svg>Прогресс</button>
  <button data-go="train"><svg class="ic" aria-hidden="true"><use href="#i-train"/></svg>Тренажёры</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Для работы сайта нужен включённый JavaScript.</p></noscript>

<script src="js/math.js"></script>
<script src="js/app.js"></script>
</body>
</html>
